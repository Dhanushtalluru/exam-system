server.port=8080
# Loads backend/.env (if present) when the app is started from the backend/ folder
spring.config.import=optional:file:.env[.properties]
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/exam_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:rootPassword}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jackson.serialization.write-dates-as-timestamps=false
jwt.secret=${JWT_SECRET:change-this-secret-to-a-long-random-string-of-32+chars}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
